function pfSeg(){const x0=PF.nx,need=PF.wd[PF.idx],spots=[];let r=R(10);if(PF.cool)r=R(5)<3?R(3):6+R(2);PF.cool=0;
const rocks=(a,b,n)=>{let last=-999;for(let i=0;i<n;i++){const x=a+R(Math.max(1,b-a));if(x-last>150){pfPut({t:"o",x,k:R(2)});last=x}}};
if(r<3){const L=340+R(120);pfGround(x0,x0+L);rocks(x0+160,x0+L-90,R(3));for(let i=0;i<1+R(3);i++)spots.push([x0+50+R(L-100),pp(CYS)]);PF.nx=x0+L}
else if(r<6){const hw=90+R(25),L=270+R(100);pfGround(x0+hw,x0+hw+L);spots.push([x0+hw/2,pp([110,188])]);spots.push([x0+hw+60+R(L-120),pp(CYS)]);PF.nx=x0+hw+L;PF.cool=1}
else if(r<8){const L=440+R(140);pfGround(x0,x0+L);const n=1+R(2);for(let k=0;k<n;k++){const px=x0+80+k*210+R(40),w=120+R(60),t=60+R(35);pfPlat(px,px+w,t);spots.push([px+w/2,t+38])}spots.push([x0+30+R(L-60),pp(CYS)]);PF.nx=x0+L}
else{const hw=170+R(40),L=280+R(80),t=70+R(20);pfPlat(x0-90,x0+hw+60,t);pfGround(x0+hw,x0+hw+L);spots.push([x0+hw/2,t+38]);spots.push([x0+hw/2+60,t+38]);spots.push([x0+hw+80+R(L-140),pp(CYS)]);PF.nx=x0+hw+L;PF.cool=1}
const sp=shuf(spots).slice(0,r>=6?3:Math.min(3,spots.length));let nd=need&&!pfLive(need);sp.forEach(q=>{let c;if(nd){c=need;nd=false}else c=pp(LO.filter(c=>!PF.wd.includes(c)));pfBub(c,q[0],q[1])});
if(R(2)){const g=PF.gr[PF.gr.length-1];pfPut({t:"d",x:g.x0+20+R(Math.max(10,g.x1-g.x0-40)),e:pp(["🌼","🌿","🍄","🌷"])})}}
function pfFill(){while(PF.nx<PF.cam+PF.sw+320)pfSeg()}
function pfFloor(x,h){let f=-1e9;if(h>=-2&&PF.gr.some(g=>x+12>g.x0&&x-12<g.x1))f=0;for(const p of PF.pl)if(p.top<=h+2&&x+12>p.x0&&x-12<p.x1&&p.top>f)f=p.top;return f}
function pfDraw(){if(!PF||!$("#pw"))return;const t=`translateX(${-PF.cam}px)`;$("#pw").style.transform=t;$("#pgw").style.transform=t;$("#pc").style.transform=`translateX(${-((PF.cam*.25)%1600)}px)`;const r=$("#pr");r.style.bottom=(60+PF.h-(S.pfc=="dog"?3:4))+"px";r.classList.toggle("air",!PF.on)}
function pfHurt(){const r=$("#pr");r.classList.remove("hurt");void r.offsetWidth;r.classList.add("hurt")}
function pfLose(k){if(k!="hole"&&PF.inv>0)return;PF.lives--;pfLives();sfx.no();pfHurt();
 if(PF.lives<=0){pfOver();return}
 if(k=="hole"){const g=PF.gr.find(g=>PF.lastG>=g.x0&&PF.lastG<=g.x1)||{x0:PF.lastG-200},rx=Math.max(g.x0+30,PF.lastG-90);PF.cam=rx-100;PF.h=0;PF.vy=0;PF.back=0;PF.on=1;PF.inv=1.6}else{PF.back=110;PF.inv=1.3}
 pfSay(`Careful! ${PF.lives} ${PF.lives==1?"life":"lives"} left.`)}
function pfOver(){PF.run=0;const w=PF.w;talk("Oh no! No lives left. Let’s try again!");const o=$("#pov");o.style.display="flex";o.innerHTML=`<div class="big" style="font-size:54px;margin:0">😢</div><div class="qt" style="color:#fbf0cf;margin:0">Out of lives! Let’s try again.</div><button class="btn" style="font-size:30px" onclick="event.stopPropagation();pfStart(0,'${w}')">Try again ▶</button>`;pfDraw()}
function pfLoop(t){if(!PF||scr!="games"||!$("#pf")){PF=null;return}if(!PF.run)return;const dt=PF.t0?Math.min(.05,(t-PF.t0)/1000):0;PF.t0=t;
if(PF.back>0){const m=Math.min(PF.back,600*dt);PF.back-=m;PF.cam-=m}else PF.cam+=170*dt;
PF.inv=Math.max(0,PF.inv-dt);const rx=PF.cam+100,f=pfFloor(rx,PF.h);PF.vy-=2200*dt;const nh=PF.h+PF.vy*dt;
if(nh<=f&&PF.vy<=0){PF.h=f;PF.vy=0;PF.on=1;PF.air=0;if(f==0)PF.lastG=rx}else{PF.h=nh;PF.on=0;PF.air+=dt}
if(PF.h<-150){pfLose("hole");if(!PF.run)return}
const h=PF.h,x2=PF.cam+100;
for(const o of PF.items){if(o.gone)continue;const dx=Math.abs(o.x-x2);
 if(o.t=="o"&&dx<34&&h<28)pfLose("rock");
 else if(o.t=="b"&&dx<80){const cx=Math.max(x2-16,Math.min(o.x,x2+16)),cyy=Math.max(h,Math.min(o.cy,h+62)),d=Math.hypot(o.x-cx,o.cy-cyy);
  if(d<32){o.gone=1;const el=$("#i"+o.id);
   if(o.c==PF.wd[PF.idx]){PF.idx++;sfx.ok();el&&el.classList.add("pop");pfHead();
    if(PF.idx>=PF.wd.length){pfWin();return}
    const nd=PF.wd[PF.idx];if(!pfLive(nd))pfBub(nd,PF.cam+PF.sw+60+R(120),pp(CYS));pfSay(`${pfSnd(o.c)}. Now find the letter that says ${pfSnd(nd)}.`)}
   else{sfx.no();el&&el.classList.add("no");setTimeout(()=>el&&el.remove(),600);if(Date.now()-PF.say>1800)pfSay(`Oops! Listen for the sound ${pfSnd(PF.wd[PF.idx])}.`)}}}}
if(Date.now()-PF.say>9000)pfPrompt();
pfFill();const cut=PF.cam-700,rm=a=>a.filter(o=>{if(o.x1!==undefined?o.x1<cut:o.x<cut){const e=$("#i"+o.id);e&&e.remove();return false}return true});PF.items=rm(PF.items);PF.gr=rm(PF.gr);PF.pl=rm(PF.pl);
pfDraw();requestAnimationFrame(pfLoop)}
function pfWin(){PF.fin=1;PF.run=0;S.coins+=3;S.earned+=3;save();sfx.win();confetti();const w=PF.w;talk(`You spelled ${w}! Well done!`);const o=$("#pov");o.style.display="flex";o.innerHTML=`<div class="big" style="font-size:64px;margin:0">🎉 ${w}</div><div class="qt" style="color:#fbf0cf;margin:0">You spelled it! +3 🌰</div><button class="btn" style="font-size:30px" onclick="event.stopPropagation();pfStart()">Next ▶</button>`;pfDraw()}
function gp(i){GW.p.push(i);const s=GW.p.map(j=>GW.l[j]).join("");if(GW.p.length==GW.w.length){if(s==GW.w){S.coins+=2;S.earned+=2;save();sfx.win();confetti();GW=null;wordB();return}sfx.no();GW.p=[]}wordB()}
function awards(){let h="";for(const k in MET){const[n,ic,ts,d,f]=MET[k],v=f();ts.forEach(t=>{const ok=v>=t;h+=`<div class="card" style="${ok?"":"opacity:.75"}"><div style="font-size:30px">${ok?ic:"🔒"}</div><b>${n} ${ts.indexOf(t)+1}</b><br><small>${d.replace("#",t)}</small><div class="bar"><i style="width:${Math.min(100,v/t*100)}%"></i></div></div>`})}
app(bar(1)+`<h2>Awards</h2><p>Fill each bar to earn a scout badge. 50 to collect!</p><div class="grid">${h}</div>`)}
const SK=["#f6d5b8","#e8b48a","#c68a5c","#8d5a3a","#5c3a26"],SH=["#2f9c95","#e0654a","#e8b23a","#8a5fb0","#4f86c6"],FU=["#f7d9e6","#fff1c9","#d9e6f7","#e7dccd","#d9f0e4","#e6d9f5"];
function set(){const sw=(a,k)=>a.map(c=>`<button class="sw" style="background:${c}" aria-label="colour" onclick="S['${k}']='${c}';save();set()"></button>`).join("");
app(bar(1)+`<h2>Settings</h2><div class="card"><div class="chips"><button class="btn" onclick="S.theme=S.theme=='night'?'day':'night';save();render()">${S.theme=="night"?"🌙 Night (campfire)":"☀️ Day (mountain walk)"}</button><button class="ghost" onclick="S.voice=!S.voice;save();set()">Voice: ${S.voice?"on":"off"}</button><button class="ghost" onclick="S.girl=!S.girl;save();set()">Explorer: ${S.girl?"Girl 👧":"Boy 👦"}</button></div><p>Skin</p><div class="chips">${sw(SK,"skin")}</div><p>Shirt</p><div class="chips">${sw(SH,"shirt")}</div><p>Hair</p><div class="chips">${sw(HAIRS,"hair")}</div><p>Poodle fur</p><div class="chips">${sw(FU,"fur")}</div><p>Poodle’s name</p><input class="t" id="pn" value="${esc(S.pet)}" maxlength="14"><button class="btn" onclick="S.pet=$('#pn').value.trim()||'Biscuit';save();set()">Save name</button> <button class="ghost" onclick="placeIntro()">Retake placement test</button> <button class="ghost" onclick="if(confirm('Delete this explorer and all progress?')){delete ALL.kids[ALL.cur];ALL.cur=null;save();render()}">Delete explorer</button> <button class="ghost" onclick="wipeAll()">Delete account</button></div>`)}
function done(){const f=S.fin&&L&&L.lv==100;app(f?`<div class="card" style="text-align:center"><div class="banner"><h1>You reached the top!</h1></div><svg viewBox="-90 -110 180 158" style="width:260px"><g transform="translate(-35,0)">${kidG(0)}</g><g transform="translate(45,0) scale(.8)">${dogG()}</g></svg><p style="font-size:26px">All 100 levels done, ${S.name}! You are a reading champion. ${esc(S.pet)} is so proud!</p><button class="btn" onclick="go('home')">Back to camp</button></div>`:`<div class="card" style="text-align:center"><div class="banner"><h1>Level complete!</h1></div><p style="font-size:26px">${ML(S.m[L.lv]||0)}! Replay to reach Mastered. +10 🌰 bonus. ${pu("c",CHEER)}</p><button class="btn" onclick="startL(S.level)">Next level ➜</button> <button class="ghost" onclick="go('home')">Camp</button></div>`);if(f)confetti()}
function onboard(){if(ob<3){app(`<div class="card"><div class="row"><svg class="mini" viewBox="-45 -110 90 125" style="width:120px">${dogG()}</svg><div class="say">Woof! Hi ${S.name}! I’m your new friend. What will you name me?</div></div><input class="t" id="pn" maxlength="14" placeholder="Biscuit"><button class="btn" onclick="S.pet=$('#pn').value.trim()||'Biscuit';save();ob=3;onboard()">That’s my name!</button></div>`);talk("Woof! What will you name me?")}else{scr="home";home();setTimeout(()=>tour(0,()=>{ob=0;placeIntro()}),300)}}
const as=(k,f)=>{const o=S;S=k;const r=f();S=o;return r};
function who(){const ks=Object.entries(ALL.kids);app(`<div class="top"><span class="l"></span><span class="coin">${UID?"☁️ Saved to your account":"💾 Saved on this device"}</span></div><div class="card" style="text-align:center"><div class="banner"><h1>Prototype Study</h1></div><p>${ks.length?"Who’s exploring today?":"Welcome! Make your first explorer."}</p><div class="grid">${ks.map(([id,k])=>`<button class="nb" onclick="choose('${id}')"><svg viewBox="-32 -54 64 100" style="width:72px;height:105px">${as(k,()=>kidG(0))}</svg><br>${k.name}<br><small>Level ${k.level}</small></button>`).join("")}</div></div><div class="card"><h2>New explorer</h2><label>Name<input class="t" id="nm" maxlength="14" autocomplete="off"></label><label>Age<input class="t" id="ag" type="number" min="3" max="14" value="5"></label><label>My explorer is a<select class="t" id="gd"><option value="0">Boy 👦</option><option value="1">Girl 👧</option></select></label><button class="btn" onclick="newKid()">Start ➜</button></div>${ks.length?'<p style="text-align:center"><button class="ghost" onclick="wipeAll()">Delete account</button></p>':""}`)}
function choose(id){ALL.cur=id;adopt();save();scr="home";render()}
function newKid(){const n=$("#nm").value.trim();if(!n){$("#nm").focus();return}const id="k"+Date.now().toString(36);ALL.kids[id]=Object.assign(clone(),{name:esc(n),age:+$("#ag").value||5,girl:$("#gd").value=="1",placed:false});ob=1;choose(id)}
async function cloud(){try{const c=await claude.use("db"),u=await claude.use("user");if(!c||!u)return;UID=await u.id();if(!UID)return;DB=c.doc("data/users/"+UID+"/camp");const g=await DB.get();if(g.exists){const o=JSON.parse(g.data().all);if((o.ts||0)>(ALL.ts||0)){ALL=o;adopt()}}save();if(scr!="lesson")render()}catch(e){}}
setInterval(()=>{if(scr=="home"&&S.name&&S.placed&&$("#bd")&&$("#bk").style.display=="none"){const d=$("#bd");d.style.display="block";d.style.left="50%";d.textContent=Math.random()<.5?pu("j",JOKES):pu("t",TRIV)}},40000);
render();cloud();
</script></body></html>
